<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grups Heterogenis - Escape Room micro:bit</title>
  
  <!-- Font i Icones -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Libreria QRCode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuració oficial de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAIsRgPh7d3pN5gEdwenOUKJZyp3cYIPVQ",
      authDomain: "dinamica-escape-room-microbit.firebaseapp.com",
      projectId: "dinamica-escape-room-microbit",
      storageBucket: "dinamica-escape-room-microbit.firebasestorage.app",
      messagingSenderId: "888747913131",
      appId: "1:888747913131:web:5d98e15807534bba892cee"
    };

    // Inicialitzar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Exposar al scope global
    window.db = db;
    window.fs = { collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, getDocs };
  </script>

  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --accent-orange: #ff9100;
      --accent-red: #ff1744;
      --text-light: #f0f6fc;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-green);
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
    }

    .subtitle {
      color: #8b949e;
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* Formulari de registre (Mòbil) */
    .register-card {
      max-width: 500px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--accent-blue);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0d1117;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .level-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .level-btn {
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #21262d;
      color: white;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-btn:hover { background: #30363d; }
    .level-btn.selected {
      border-color: var(--accent-green);
      background: rgba(0, 230, 118, 0.15);
      font-weight: bold;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .badge-1 { background: #334155; color: #cbd5e1; }
    .badge-2 { background: #1e3a8a; color: #93c5fd; }
    .badge-3 { background: #065f46; color: #6ee7b7; }
    .badge-4 { background: #78350f; color: #fde047; }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .btn-main:hover {
      background: #00c853;
      transform: translateY(-2px);
    }

    /* Projecció / Taulell del Moderador */
    .dashboard {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 25px;
    }

    @media (max-width: 850px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .qr-panel {
      background: #0d1117;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin: 15px 0;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #0d1117;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-blue);
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .group-card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--accent-blue);
      border-radius: 8px;
      padding: 15px;
    }

    .group-card.has-advanced {
      border-top-color: var(--accent-green);
    }

    .group-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .member-list {
      list-style: none;
    }

    .member-item {
      padding: 6px 0;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .member-item:last-child { border-bottom: none; }

    .assigned-view {
      text-align: center;
      padding: 30px 10px;
    }

    .group-badge-large {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      color: var(--accent-green);
      margin: 20px 0;
      text-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-microchip"></i> Escape Room micro:bit</h1>
    <p class="subtitle">Generador de Grups Heterogenis en Temps Real</p>
  </header>

  <div class="container" id="app">
    <!-- Es carregarà dinàmicament segons el mode (Client / Moderador) -->
    <p style="text-align: center;">Carregant aplicació...</p>
  </div>

  <script>
    // Variables Globals
    let currentSession = "AULA-1";
    let selectedLevel = 0;
    let myStudentId = localStorage.getItem("microbit_student_id") || null;

    // Inicialitzar la vista quan Firebase estigui a punt
    window.addEventListener('load', () => {
      const checkFirebase = setInterval(() => {
        if (window.db && window.fs) {
          clearInterval(checkFirebase);
          initApp();
        }
      }, 100);
    });

    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const isModerator = urlParams.get('mode') === 'mod' || !urlParams.has('session');

      if (urlParams.has('session')) {
        currentSession = urlParams.get('session');
      }

      if (isModerator) {
        renderModeratorView();
      } else {
        renderStudentView();
      }
    }

    // --- VISTA DE L'ALUMNE (MÒBIL) ---
    function renderStudentView() {
      const app = document.getElementById('app');

      if (myStudentId) {
        // Escoltar canvis en el seu propi registre per veure quin grup té assignat
        const docRef = window.fs.doc(window.db, "sessions", currentSession, "students", myStudentId);
        window.fs.onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.group) {
              app.innerHTML = `
                <div class="assigned-view">
                  <h2>¡Hola, ${data.name}!</h2>
                  <p>Has estat assignat/da al:</p>
                  <div class="group-badge-large">EQUIP ${data.group}</div>
                  <p><i class="fa-solid fa-lock-open"></i> Troba els teus companys i comença l'Escape Room!</p>
                </div>
              `;
            } else {
              app.innerHTML = `
                <div class="assigned-view">
                  <h2>¡Hola, ${data.name}!</h2>
                  <p style="margin-top: 15px; color: var(--accent-blue);">S'han rebut les teves dades correctament.</p>
                  <p style="margin-top: 10px;">Esperant que el docent generi els grups...</p>
                  <div style="margin-top:20px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
                </div>
              `;
            }
          } else {
            localStorage.removeItem("microbit_student_id");
            myStudentId = null;
            renderStudentView();
          }
        });
        return;
      }

      app.innerHTML = `
        <div class="register-card">
          <h2 style="margin-bottom:20px; text-align:center;"><i class="fa-solid fa-user-plus"></i> Registre de Participant</h2>
          
          <div class="form-group">
            <label for="studentName">El teu Nom i Cognom:</label>
            <input type="text" id="studentName" placeholder="Ex: Marc García" autocomplete="off">
          </div>

          <div class="form-group">
            <label>Nivell d'experiència en micro:bit:</label>
            <div class="level-options">
              <button class="level-btn" onclick="selectLevel(1, this)">
                <span>1. Novell (Mai he usat micro:bit)</span>
                <span class="badge badge-1">Nivell 1</span>
              </button>
              <button class="level-btn" onclick="selectLevel(2, this)">
                <span>2. Bàsic (Conec MakeCode/blocs)</span>
                <span class="badge badge-2">Nivell 2</span>
              </button>
              <button class="level-btn" onclick="selectLevel(3, this)">
                <span>3. Intermedi (Crea programes senzills)</span>
                <span class="badge badge-3">Nivell 3</span>
              </button>
              <button class="level-btn" onclick="selectLevel(4, this)">
                <span>4. Avançat (Programo bé / Sensors)</span>
                <span class="badge badge-4">Nivell 4</span>
              </button>
            </div>
          </div>

          <button class="btn-main" onclick="registerStudent()">Enviar i Unir-me</button>
        </div>
      `;
    }

    function selectLevel(lvl, btn) {
      selectedLevel = lvl;
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    async function registerStudent() {
      const nameInput = document.getElementById('studentName');
      const name = nameInput.value.trim();

      if (!name) {
        alert("Si us plau, escriu el teu nom.");
        return;
      }
      if (selectedLevel === 0) {
        alert("Si us plau, selecciona el teu nivell d'experiència.");
        return;
      }

      const newStudentId = "std_" + Math.random().toString(36).substr(2, 9);
      
      try {
        await window.fs.setDoc(window.fs.doc(window.db, "sessions", currentSession, "students", newStudentId), {
          name: name,
          level: selectedLevel,
          group: null,
          timestamp: Date.now()
        });

        localStorage.setItem("microbit_student_id", newStudentId);
        myStudentId = newStudentId;
        renderStudentView();
      } catch (err) {
        alert("Error en desar el registre: " + err.message);
      }
    }

    // --- VISTA DEL MODERADOR (PROJECTION / TAULELL) ---
    function renderModeratorView() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="dashboard">
          <div class="qr-panel">
            <h3>Accés Participants</h3>
            <p style="font-size:0.85rem; color:#8b949e; margin-top:5px;">Escaneja per escollir el teu nivell</p>
            <div id="qrcode"></div>
            <p style="font-weight:bold; color:var(--accent-green);">Sessió: ${currentSession}</p>
          </div>

          <div class="controls-panel">
            <div class="stats-bar">
              <div class="stat-card">
                <div>Inscrits</div>
                <div class="stat-value" id="count-total">0</div>
              </div>
              <div class="stat-card">
                <div>Nivell 4 (Avançats)</div>
                <div class="stat-value" id="count-l4" style="color:var(--accent-orange);">0</div>
              </div>
            </div>

            <div style="display:flex; gap:15px; align-items:center;">
              <label for="numGroups" style="margin:0;">Nombre de Grups a crear:</label>
              <input type="number" id="numGroups" value="4" min="2" max="15" style="width:70px; padding:8px; border-radius:6px; background:#0d1117; color:white; border:1px solid var(--border-color);">
              <button class="btn-main" style="margin:0; flex:1;" onclick="generateHeterogeneousGroups()">Generar Equips Heterogenis</button>
              <button class="btn-danger" onclick="resetSession()">Netejar</button>
            </div>

            <div id="groups-container" class="groups-grid"></div>
          </div>
        </div>
      `;

      // Generar Codi QR
      const studentUrl = window.location.origin + window.location.pathname + "?session=" + currentSession + "&mode=attendee";
      new QRCode(document.getElementById("qrcode"), {
        text: studentUrl,
        width: 180,
        height: 180
      });

      // Escoltar en Temps Real tots els participants
      const colRef = window.fs.collection(window.db, "sessions", currentSession, "students");
      window.fs.onSnapshot(colRef, (snapshot) => {
        const students = [];
        snapshot.forEach(doc => students.push({ id: doc.id, ...doc.data() }));
        
        updateStatsAndDashboard(students);
      });
    }

    function updateStatsAndDashboard(students) {
      document.getElementById('count-total').innerText = students.length;
      document.getElementById('count-l4').innerText = students.filter(s => s.level === 4).length;

      // Agrupar per equip si ja estan generats
      const groupsMap = {};
      students.forEach(s => {
        if (s.group) {
          if (!groupsMap[s.group]) groupsMap[s.group] = [];
          groupsMap[s.group].push(s);
        }
      });

      const container = document.getElementById('groups-container');
      if (Object.keys(groupsMap).length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#8b949e;">Encara no s'han creat equips. Premeu "Generar Equips Heterogenis".</p>`;
        return;
      }

      container.innerHTML = '';
      Object.keys(groupsMap).sort((a,b) => a - b).forEach(gId => {
        const members = groupsMap[gId];
        const hasL4 = members.some(m => m.level === 4);

        const card = document.createElement('div');
        card.className = `group-card ${hasL4 ? 'has-advanced' : ''}`;
        card.innerHTML = `
          <div class="group-title">
            <span>Grup ${gId}</span>
            ${hasL4 ? '<i class="fa-solid fa-star" style="color:var(--accent-orange);" title="Te membre d\'Anvançat"></i>' : ''}
          </div>
          <ul class="member-list">
            ${members.map(m => `
              <li class="member-item">
                <span>${m.name}</span>
                <span class="badge badge-${m.level}">N${m.level}</span>
              </li>
            `).join('')}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    // ALGORISME D'AGRUPACIÓ HETEROGÈNIA
    async function generateHeterogeneousGroups() {
      const numGroups = parseInt(document.getElementById('numGroups').value) || 2;
      
      const colRef = window.fs.collection(window.db, "sessions", currentSession, "students");
      const snapshot = await window.fs.getDocs(colRef);
      
      let students = [];
      snapshot.forEach(docSnap => students.push({ id: docSnap.id, ...docSnap.data() }));

      if (students.length === 0) {
        alert("No hi ha participants inscrits.");
        return;
      }

      // Separar per nivells (De Nivell 4 a Nivell 1)
      const l4 = students.filter(s => s.level === 4);
      const l3 = students.filter(s => s.level === 3);
      const l2 = students.filter(s => s.level === 2);
      const l1 = students.filter(s => s.level === 1);

      // Barrejar arrays per a distribució aleatòria dins del mateix nivell
      const shuffle = arr => arr.sort(() => Math.random() - 0.5);
      
      const orderedStudents = [
        ...shuffle(l4),
        ...shuffle(l3),
        ...shuffle(l2),
        ...shuffle(l1)
      ];

      // Repartiment Snake/Round-Robin per equilibrar
      const groups = Array.from({ length: numGroups }, () => []);
      
      orderedStudents.forEach((student, index) => {
        const groupIndex = index % numGroups;
        groups[groupIndex].push(student);
      });

      // Guardar a Firebase
      for (let g = 0; g < groups.length; g++) {
        const groupNum = g + 1;
        for (let student of groups[g]) {
          await window.fs.updateDoc(window.fs.doc(window.db, "sessions", currentSession, "students", student.id), {
            group: groupNum
          });
        }
      }
    }

    async function resetSession() {
      if (!confirm("Segur que vols esborrar tots els participants d'aquesta sessió?")) return;

      const colRef = window.fs.collection(window.db, "sessions", currentSession, "students");
      const snapshot = await window.fs.getDocs(colRef);
      snapshot.forEach(async (docSnap) => {
        await window.fs.deleteDoc(docSnap.ref);
      });
    }
  </script>
</body>
</html>
